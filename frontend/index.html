<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>

        *{
            box-sizing: border-box;
        }

        body{
            background:#bbb ;
        }

        #formulario{
            background: #ddd;
            border-radius: 10px;
        }

        input{
            outline: none;
        }

        #input3, #input4{
            outline:none;
        }

    </style>
</head>
<body>

    <div class="container vh-100">
        <div class=" vh-100 row d-flex justify-content-center align-items-center ">
            <div class="col-sm-10 col-md-10 col-lg-5">
                <form action="" class="p-3" id="formulario">
                    <span class="fw-bold">INICIO DE SESION</span>
                    <hr>
                    <div class="btn-group w-100 mb-1" role="group">
                        <button type="button" class="btn px-0 bg-secondary" id="input1">Left</button>
                        <button type="button" class="btn p-0 ps-2 bg-white" id="input3">
                            <input type="text" class="bg-transparent w-100 border-0"  placeholder="INGRESE USUARIO">
                        </button>
                    </div>
                    <div class="btn-group w-100" role="group">
                        <button type="button" class="btn px-0 bg-secondary" id="input2">Right</button>
                        <button type="button" class="btn p-0 ps-2 bg-white" id="input4">
                            <input type="password" class=" bg-transparent w-100 border-0"  placeholder="INGRESE CONTRASEÑA">
                        </button>
                    </div>
                    <hr>
                    <input type="submit" class="w-100 mb-1 py-2 px-3 rounded-1 fs-5 bg-primary text-white border-0" value="INGRESAR">
                </form>
            </div>
        </div>
    </div>
    
</body>

<script>

document.querySelector('#input1').innerHTML=
        `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="white" class="bi bi-person-fill" viewBox="0 0 16 16">
        <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
        </svg>`

        document.querySelector('#input2').innerHTML=
        `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="white" class="bi bi-lock-fill" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M8 0a4 4 0 0 1 4 4v2.05a2.5 2.5 0 0 1 2 2.45v5a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 2 13.5v-5a2.5 2.5 0 0 1 2-2.45V4a4 4 0 0 1 4-4m0 1a3 3 0 0 0-3 3v2h6V4a3 3 0 0 0-3-3"/></svg>`


</script>

</html>
